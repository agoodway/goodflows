[package]
name = "goodci"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Mini CI runner for Ampcode orbs — parallel job execution with a simple config"
license = "MIT"
authors = ["Thomas Brewer"]

[[bin]]
name = "goodci"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
