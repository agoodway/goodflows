name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        rust: ["1.88.0", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$TOOLCHAIN"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build CLI for plugin integration tests
        run: cargo build --locked
      - name: Test Amp plugin
        run: node --test tests/amp-plugin.test.mjs
      - name: Run goodflows's own checks
        run: ./target/release/goodflows
