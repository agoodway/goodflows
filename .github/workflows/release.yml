name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# Releases the CLI. Order on a tag push: verify-versions, then the reporters
# drift guard and build, then publish. Nothing is published unless every check
# passed. A workflow_dispatch run builds without publishing. The reporters are
# versioned on their own and released by Reporter release, not by this workflow.
jobs:
  # A tag must name the CLI version in Cargo.toml.
  verify-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify the tag names the CLI version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            scripts/verify-versions.sh "$REF_NAME"
          else
            scripts/verify-versions.sh
          fi

  # The same reporter drift guard as CI, so a release never ships a CLI that
  # rejects the published reporters' output.
  reporters:
    needs: verify-versions
    uses: ./.github/workflows/reporters.yml

  build:
    needs: verify-versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Linux packaging compiles inside Debian 12, so allow time to build that image.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target "$TARGET"
          rustup override set 1.88.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build and package
        # Linux targets link in Debian 12. See scripts/package-release.sh.
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          fi
          bash scripts/package-release.sh "$TARGET" "$tag"
      - uses: actions/upload-artifact@v7
        with:
          name: goodflows-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, reporters]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: goodflows-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.sha256 SHA256SUMS --verify-tag --generate-notes --title "$RELEASE_TAG"
