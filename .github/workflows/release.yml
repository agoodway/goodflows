name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

# Order on a tag push: verify-versions, then mirror-check (with the deploy
# keys) and the reporters drift guard, then build, then publish, and only after
# the release is published, mirror-reporters pushes the mirrors. Nothing is
# published or pushed unless every check passed, and no mirror gets a tag
# without a CLI release. A workflow_dispatch run builds and runs mirror-dry-run
# instead, which never sees the deploy keys.
jobs:
  # The CLI and both reporters ship in lockstep; a tag must name that version.
  verify-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify CLI, reporter and tag versions agree
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            scripts/verify-versions.sh "$REF_NAME"
          else
            scripts/verify-versions.sh
          fi

  # Before building anything, check that the mirrors can take this tag: both
  # deploy keys are set (the error names each missing secret), the tag is on
  # main, and each mirror's main is an ancestor of the new split. Nothing is
  # pushed. The deploy keys are
  # secrets of the reporter-mirrors environment, which only v* tags may deploy
  # to, so no branch can read them.
  mirror-check:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: verify-versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: reporter-mirrors
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check reporter mirror deploy keys
        env:
          EXUNIT_REPORTER_DEPLOY_KEY: ${{ secrets.EXUNIT_REPORTER_DEPLOY_KEY }}
          JEST_REPORTER_DEPLOY_KEY: ${{ secrets.JEST_REPORTER_DEPLOY_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/mirror-reporters.sh "$REF_NAME" --check-keys
      - name: Verify the mirrors can take the tag
        env:
          EXUNIT_REPORTER_DEPLOY_KEY: ${{ secrets.EXUNIT_REPORTER_DEPLOY_KEY }}
          JEST_REPORTER_DEPLOY_KEY: ${{ secrets.JEST_REPORTER_DEPLOY_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/mirror-reporters.sh "$REF_NAME" --verify

  # The same reporter drift guard as CI, so a release never ships reporters
  # whose output goodflows rejects.
  reporters:
    needs: verify-versions
    uses: ./.github/workflows/reporters.yml

  build:
    needs: [verify-versions, mirror-check]
    # mirror-check is skipped on workflow_dispatch; build still needs it to
    # have passed whenever it ran.
    if: >-
      !cancelled() && needs.verify-versions.result == 'success' &&
      (needs.mirror-check.result == 'success' || needs.mirror-check.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    # Linux packaging compiles inside Debian 12, so allow time to build that image.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target "$TARGET"
          rustup override set 1.88.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build and package
        # Linux targets link in Debian 12. See scripts/package-release.sh.
        env:
          TARGET: ${{ matrix.target }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          fi
          bash scripts/package-release.sh "$TARGET" "$tag"
      - uses: actions/upload-artifact@v7
        with:
          name: goodflows-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # A workflow_dispatch run is a dry run of the mirror split: it prints the
  # split SHAs and the source check, and pushes nothing. It gets no deploy
  # keys, so it does not fetch the mirrors; mirror-check does that on a tag.
  mirror-dry-run:
    # mirror-check, which build needs, is skipped on workflow_dispatch, and a
    # bare `if` would skip this job along with it.
    if: >-
      !cancelled() && github.event_name != 'push' &&
      needs.build.result == 'success' && needs.reporters.result == 'success'
    needs: [build, reporters]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Split reporter mirrors (dry run)
        run: |
          tag="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          scripts/mirror-reporters.sh "$tag" --dry-run

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, reporters, mirror-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: goodflows-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.sha256 SHA256SUMS --verify-tag --generate-notes --title "$RELEASE_TAG"

  # Splits each reporter into its read-only mirror with the release tag, only
  # after the CLI release is published. The script repeats every check before
  # pushing anything, and main is never forced. SSH trusts only GitHub's pinned
  # host keys. If this job fails after publish, fix the cause and re-run it
  # (Re-run failed jobs); the push is idempotent for the same tag.
  mirror-reporters:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, reporters, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: reporter-mirrors
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Split and push reporter mirrors
        env:
          EXUNIT_REPORTER_DEPLOY_KEY: ${{ secrets.EXUNIT_REPORTER_DEPLOY_KEY }}
          JEST_REPORTER_DEPLOY_KEY: ${{ secrets.JEST_REPORTER_DEPLOY_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/mirror-reporters.sh "$REF_NAME"
