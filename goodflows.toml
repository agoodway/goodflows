# goodflows.toml — example for a Rust project
# Adjust parallelism to match your Amp orb size

[reporting]
project = "goodflows"
history = true

[settings]
parallelism = 4
fail_fast = true

[[jobs]]
name = "fmt"
command = "cargo fmt --check"

[[jobs]]
name = "clippy"
command = "cargo clippy --locked --all-targets -- -D warnings"
depends_on = ["fmt"]

[[jobs]]
name = "test"
command = """
cargo build --locked --quiet --manifest-path reporters/nextest/Cargo.toml \
  && reporters/nextest/target/debug/goodflows-nextest-reporter -- cargo nextest run --locked --workspace
"""
depends_on = ["fmt"]
reports = ["test-timings"]

[[jobs]]
name = "doc"
command = "cargo doc --locked --no-deps"
depends_on = ["fmt"]
